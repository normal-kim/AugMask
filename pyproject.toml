[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "augmask"
version = "0.1.0"
description = "AugMask: training diffusion models on incomplete tabular data via stochastic augmentation and masking (ICML 2026)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
  { name = "Jungkyu Kim" },
  { name = "Taeyoung Park" },
  { name = "Kibok Lee" },
]
dependencies = [
  "numpy>=1.24,<2",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "lightgbm>=4.0",
]

[project.optional-dependencies]
# diffusion backbones (TabDDPM, CDTD, TabDiff) and MIWAE
torch = ["torch>=2.1"]
# reading the Default dataset (.xls)
data = ["xlrd>=2.0"]
# evaluation (MLE uses XGBoost; Shape/Trend use sdmetrics)
eval = ["xgboost>=2.0", "sdmetrics>=0.17"]
# ForestDiff baseline: the official implementation
baselines = ["ForestDiffusion==1.0.6"]
dev = ["pytest>=7", "matplotlib>=3.7"]  # tests and the README figure
all = ["augmask[torch,data,eval,baselines,dev]"]

[tool.setuptools.packages.find]
include = ["augmask*"]
