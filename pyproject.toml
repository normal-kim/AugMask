[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "augmask"
version = "0.1.2"
description = "AugMask: training diffusion models on incomplete tabular data via stochastic augmentation and masking (ICML 2026)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.13"
keywords = ["diffusion models", "tabular data", "missing data", "data augmentation", "synthetic data"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [
  { name = "Jungkyu Kim" },
  { name = "Taeyoung Park" },
  { name = "Kibok Lee" },
]
dependencies = [
  "numpy>=1.24,<2",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "lightgbm>=4.0",            # LGBM-S
  "torch>=2.1",               # TabDDPM, CDTD, TabDiff, MIWAE
  "xlrd>=2.0",                # the Default dataset (.xls)
  "xgboost>=2.0",             # Utility
  "sdmetrics>=0.17",          # Shape, Trend
  "ForestDiffusion==1.0.6",   # ForestDiff (the official package)
]

[project.urls]
Homepage = "https://github.com/normal-kim/AugMask"
Paper = "https://arxiv.org/abs/2606.03347"

[tool.setuptools.packages.find]
include = ["augmask*"]
